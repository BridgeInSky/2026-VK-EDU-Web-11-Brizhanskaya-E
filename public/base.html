<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskMe - Вопросы и ответы</title>
    
    <!-- Bootstrap CSS (локальная копия) -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">
    <!-- Собственные стили -->
    <link href="static/css/style.css" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="static/img/favicon.ico">
</head>
<body>
    <!-- Header -->
    <header class="bg-dark text-white py-3">
        <div class="container">
            <div class="row align-items-center">
                <!-- Логотип -->
                <div class="col-md-3 col-12 text-center text-md-start mb-3 mb-md-0">
                    <a href="index.html" class="text-white text-decoration-none">
                        <h1 class="h3 mb-0">AskMe</h1>
                        <small>Сообщество вопросов и ответов</small>
                    </a>
                </div>
                
                <!-- Поиск -->
                <div class="col-md-6 col-lg-4 mb-3">
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Поиск вопросов...">
                        <button class="btn btn-outline-light" type="submit">Найти</button>
                    </form>
                </div>
                <div div class="col-md-12 col-lg-4 mb-3">
                    <div class="d-flex justify-content-center justify-content-md-center align-items-center gap-3">
                        <a href="ask.html" class="btn btn-primary">Задать вопрос</a>
                        <div class="dropdown">
                            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <img src="\static\img\avatars\avatar-default.png" alt="Avatar" class="rounded-circle" width="30" height="30">
                                Гость
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="login.html">Войти</a></li>
                                <li><a class="dropdown-item" href="signup.html">Регистрация</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="py-4">
        <div class="container">
            <div class="row">
                <!-- Левая колонка: основной контент -->
                <div class="col-lg-8 col-12">

                </div>
                
                <!-- Правая колонка: Sidebar -->
                <div class="col-lg-4 col-12 mt-4 mt-lg-0">
                    <!-- Блок популярных тегов -->
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Популярные теги</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex flex-wrap gap-2">
                                <a href="#" class="badge bg-secondary text-decoration-none fs-6 p-2">python</a>
                                <a href="#" class="badge bg-secondary text-decoration-none fs-6 p-2">django</a>
                                <a href="#" class="badge bg-secondary text-decoration-none fs-6 p-2">javascript</a>
                                <a href="#" class="badge bg-secondary text-decoration-none fs-6 p-2">html</a>
                                <a href="#" class="badge bg-secondary text-decoration-none fs-6 p-2">css</a>
                                <a href="#" class="badge bg-secondary text-decoration-none fs-6 p-2">bootstrap</a>
                                <a href="#" class="badge bg-secondary text-decoration-none fs-6 p-2">git</a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Блок лучших участников -->
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Лучшие участники</h5>
                        </div>
                        <div class="card-body">
                            <ul class="list-unstyled mb-0 member-list">
                                <li class="mb-2"><a href="#">Алексей Иванов</a></li>
                                <li class="mb-2"><a href="#">Мария Петрова</a></li>
                                <li class="mb-2"><a href="#">Дмитрий Сидоров</a></li>
                                <li class="mb-2"><a href="#">Елена Смирнова</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">© 2026 AskMe. Все права защищены.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="static/js/bootstrap.bundle.min.js"></script>
    <!-- Собственные скрипты -->
    <script src="static/js/main.js"></script>
</body>
</html>
