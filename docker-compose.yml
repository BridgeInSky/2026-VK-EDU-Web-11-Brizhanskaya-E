services:
  db:
    image: postgres:16-alpine
    container_name: ask_me_db
    environment:
      POSTGRES_DB: ask_me
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 04092014vfif
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ask_me_network

  redis:
    image: redis:7-alpine
    container_name: ask_me_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ask_me_network

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: ask_me_centrifugo
    ports:
      - "8001:8000"
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    command: centrifugo --config=/centrifugo/config.json
    restart: unless-stopped
    networks:
      - ask_me_network

  mailhog:
    image: mailhog/mailhog
    container_name: ask_me_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks:
      - ask_me_network

  nginx:
    image: nginx:alpine
    container_name: ask_me_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
      - ./uploads:/uploads:ro
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - ask_me_network

volumes:
  postgres_data:
    name: ask_me_postgres_data
  redis_data:
    name: ask_me_redis_data

networks:
  ask_me_network:
    name: ask_me_network
    # driver: bridge